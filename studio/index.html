<!doctype html>
<html lang="en" data-theme="dark" data-view="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>XGames.fun Studio</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  // The theme before the first paint: ?theme=light|dark wins, then the person's choice (the header's switch), else dark.
  try { const q = new URLSearchParams(location.search).get('theme'), s = localStorage.getItem('gamesfun.theme'), t = q || s; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="stylesheet" href="studio.css">
<script type="module" src="studio.js"></script>
</head>
<body>
<header class="bar">
  <div class="brand">
    <span class="xg-mark" aria-label="XGames.fun">XGames<span>.fun</span></span>
    <span class="brand-label">Studio</span>
  </div>
  <div class="project">
    <button type="button" id="home-btn" class="ghost small" title="Your games, and a new one">All games</button>
    <div class="game-title" id="game-title">Loading…</div>
  </div>
  <nav class="links" aria-label="Game">
    <span class="badge" id="network" title="Solana network for this game (gamesfun.json)" hidden></span>
    <a id="open-game" class="btn ghost game-only" href="/game/" target="_blank" rel="noopener">Open game<span class="ext" aria-hidden="true">↗</span></a>
    <button type="button" id="wallet-btn" class="ghost" hidden>Connect wallet</button>
    <button type="button" id="theme-btn" class="ghost icon" title="Switch to the light theme" aria-label="Switch to the light theme"><span aria-hidden="true">◐</span></button>
  </nav>
</header>
<main class="layout">
  <!-- no game open: the start page (studio/start.js) -->
  <section class="start" id="start" aria-label="Start"></section>
  <!-- a game open: the conversation on the left (studio/chat.js), the game and its tools on the right -->
  <section class="chat" id="chat" aria-label="Conversation"></section>
  <section class="product" aria-label="Your game">
    <div class="product-bar">
      <div class="tabs" role="tablist" id="tabs" aria-label="Tools"></div>
      <!-- the flow's last step: a tool that declares `action` (e.g. Publish) gets a primary button here -->
      <div class="product-actions" id="product-actions"></div>
      <div class="preview-bar">
        <!-- what the preview shows: the game alone (with bots) or the friends lobby, as two picture pills -->
        <div class="preview-modes" role="radiogroup" aria-label="What the preview shows">
          <button type="button" role="radio" class="preview-mode" data-path="/game/" aria-checked="true" title="Play the game alone, with bots">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M7.5 10.5v4M5.5 12.5h4"/><circle cx="15.5" cy="11.5" r="1"/><circle cx="17.5" cy="13.5" r="1"/></svg>
            <span>Solo with bots</span>
          </button>
          <button type="button" role="radio" class="preview-mode" data-path="/game/gf/mp/" aria-checked="false" title="The friends lobby: host a room here">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-1a6 6 0 0 1 12 0v1"/><path d="M16 5.5a3 3 0 0 1 0 5M18 14a5.5 5.5 0 0 1 3 5v1"/></svg>
            <span>Friends lobby</span>
          </button>
        </div>
        <button type="button" id="preview-reload" class="ghost small icon-text" title="Start the game over">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
          <span>Restart</span>
        </button>
        <span class="hint" id="preview-hint" title="Every saved change reloads the game by itself"><span class="dot ok" aria-hidden="true"></span> Live</span>
      </div>
    </div>
    <div class="product-body">
      <div class="preview">
        <div class="frame-wrap"><iframe id="preview" title="Game preview" src="about:blank" allow="autoplay; fullscreen; gamepad; clipboard-write"></iframe></div>
        <div class="product-empty" id="product-empty" hidden></div>
        <button type="button" class="preview-cover" title="Back to the game" aria-label="Back to the game"></button>
      </div>
      <aside class="inspector side" id="inspector" aria-label="Tool" hidden><!-- .side: the name tests/economy-shots.mjs scrolls to on a phone -->
        <div class="inspector-head"><h2><span id="inspector-icon" aria-hidden="true"></span><span id="inspector-title"></span></h2><button type="button" id="inspector-close" class="ghost icon small" title="Close the tool (the game gets the room)" aria-label="Close the tool">×</button></div>
        <div class="panels" id="panels"></div>
      </aside>
    </div>
  </section>
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
