# Tests, then a real game of each engine: create from the example and verify it in real Chrome with the CI profile.
# Actions are disabled for this repository on purpose (the owner's billing decision, gate G1); this runs once they
# are enabled. Nothing here has run on GitHub yet. Read docs/CI.md first: what a runner cannot check, the profile,
# the cost per run.
#
# Pull requests run Linux and Windows. macOS (ten times the minutes) runs on pushes to main and by hand.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "0"
  GAMESFUN_NO_UPDATE_CHECK: "1"
  # The profile (.github/ci-profile.json) sets this too; here it also covers `doctor` and the tests.
  GF_VERIFY_SOFTWARE: "1"   # runners have no graphics card: Chrome draws with SwiftShader (docs/CI.md)

jobs:
  # A party (WebGL) game: install, tests, create from the example, the checks a runner can run.
  party:
    name: party (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request'
        && '{"include":[{"os":"ubuntu-latest","chrome":"/usr/bin/google-chrome"},{"os":"windows-latest","chrome":"C:/Program Files/Google/Chrome/Application/chrome.exe"}]}'
        || '{"include":[{"os":"ubuntu-latest","chrome":"/usr/bin/google-chrome"},{"os":"windows-latest","chrome":"C:/Program Files/Google/Chrome/Application/chrome.exe"},{"os":"macos-latest","chrome":"/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"}]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CHROME_PATH: ${{ matrix.chrome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests (no browser)
        run: npm test
      - name: Skills mirrors in sync
        run: node scripts/sync-skills.mjs --check
      - name: Chrome is where the matrix says
        shell: node {0}
        run: |
          const { existsSync } = require('node:fs');
          if (!existsSync(process.env.CHROME_PATH)) { console.error('no Chrome at ' + process.env.CHROME_PATH); process.exit(1); }
          console.log('Chrome at ' + process.env.CHROME_PATH);
      - name: Doctor (everything but the graphics probe; agents are only notes)
        run: node bin/gamesfun.mjs doctor --skip-graphics
      - name: Examples and catalog
        run: |
          node bin/gamesfun.mjs examples
          node bin/gamesfun.mjs catalog --all
      - name: Create a party game from the example
        run: node bin/gamesfun.mjs create games/ci --from soak-squad
      - name: Verify --quick under the CI profile (docs/CI.md)
        # Not yet run on Windows or macOS: a failure there is reported, and fixed from its log, without blocking the pull request.
        continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
        timeout-minutes: 12
        run: node bin/gamesfun.mjs verify games/ci --quick --profile .github/ci-profile.json
      - name: Keep the verify evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-party-${{ matrix.os }}
          path: games/ci/evidence/
          if-no-files-found: ignore
          retention-days: 14

  # A scenic (WebGPU) game. A runner has no WebGPU adapter, so the engine runs on WebGL2 inside WebGPURenderer.
  scenic:
    name: scenic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request'
        && '{"include":[{"os":"ubuntu-latest","chrome":"/usr/bin/google-chrome"},{"os":"windows-latest","chrome":"C:/Program Files/Google/Chrome/Application/chrome.exe"}]}'
        || '{"include":[{"os":"ubuntu-latest","chrome":"/usr/bin/google-chrome"},{"os":"windows-latest","chrome":"C:/Program Files/Google/Chrome/Application/chrome.exe"},{"os":"macos-latest","chrome":"/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"}]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CHROME_PATH: ${{ matrix.chrome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create a scenic game from the example
        run: node bin/gamesfun.mjs create games/ci-scenic --from isle-run
      - name: Verify --quick under the CI profile (software rendering; no WebGPU, so WebGL2 inside WebGPURenderer)
        continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
        timeout-minutes: 12
        run: node bin/gamesfun.mjs verify games/ci-scenic --quick --profile .github/ci-profile.json
      - name: Keep the verify evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-scenic-${{ matrix.os }}
          path: games/ci-scenic/evidence/
          if-no-files-found: ignore
          retention-days: 14
