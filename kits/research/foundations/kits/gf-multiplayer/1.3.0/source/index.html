<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play with friends</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="party.css">
</head>
<body>
<!-- games.fun multiplayer kit: the party shell. Kit-owned and byte-identical in every game (never edit a copy).
     It wraps the game's own single-player page (../../index.html) in a frame, so the game needs no multiplayer code:
     vendor/gf.js (the host-join kit) draws the Host / Join lobby and carries the room over WebRTC, room.js is the
     generic race room, and party.js reads the game's outcome as ../../multiplayer.json says.
     Standard: research/multiplayer/STANDARD.md -->
<div id="party" data-phase="boot">
  <main id="stage">
    <iframe id="game" title="Game" allow="autoplay; fullscreen; gamepad; clipboard-write" hidden></iframe>
    <section id="card" class="card" aria-live="polite" hidden></section>
  </main>
  <aside id="rail" hidden>
    <header>
      <h1 id="rail-title"></h1>
      <p id="rail-sub"></p>
    </header>
    <ol id="racers" aria-label="Players"></ol>
    <p id="status" role="status"></p>
    <div id="controls">
      <button id="start" class="primary" hidden>Start</button>
      <button id="stop" hidden>End round</button>
    </div>
  </aside>
</div>
<script src="party.js"></script>
</body>
</html>
